name: Check hpdsp hotel availability

on:
  # 2026-09-25: the native `schedule:` trigger used to live here (tried
  # ":00" hourly, then moved to ":10" to dodge GitHub's busiest scheduling
  # moment) but it turned out GitHub's own cron scheduler was broken
  # platform-wide around this time (many other users hit the exact same
  # thing - see README's troubleshooting note) - it would go hours without
  # firing at all, then unpredictably fire once with a multi-hour delay.
  # Replaced it with an external cron service (cron-job.org) calling this
  # workflow's `workflow_dispatch` REST endpoint on a schedule instead,
  # which actually fires reliably. Removed the `schedule:` block entirely
  # (rather than leaving it alongside the external one) because the two
  # together caused duplicate Discord posts - GitHub's scheduler would
  # eventually fire on its own, unpredictably, on top of the external
  # trigger. workflow_dispatch below is what both the external cron
  # service AND your own manual "Run workflow" clicks use.
  workflow_dispatch: {}

permissions:
  contents: write   # needed so the workflow can commit state.json back

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          # 2026-09-25: check_hpdsp.py now fetches pages with headless
          # Chromium (via Playwright) instead of plain `requests`, because
          # hpdsp.net appears to serve a stripped/empty calendar page (HTTP
          # 200, but no data) to non-browser clients - a real browser
          # fetching the exact same URL got the correct page every time.
          # This installs Chromium + its OS-level deps; adds ~30-60s to
          # each run, still comfortably inside GitHub's free Actions minutes.
          playwright install --with-deps chromium

      - name: Run availability check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python check_hpdsp.py

      - name: Commit updated state
        run: |
          git config user.name "hpdsp-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json logs/hpdsp_log.md logs/history.csv
          git diff --quiet --cached || git commit -m "Update hpdsp availability state + log [skip ci]"
          # The Rakuten workflow commits to the same branch on its own
          # schedule; pull --rebase first so an overlapping run doesn't
          # get its push rejected.
          git pull --rebase
          git push
